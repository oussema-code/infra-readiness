# These hostnames resolve inside the Compose network, not on the host machine.
concurrency: 4
checks:
  - name: database-dns
    type: dns
    host: db
  - name: database-tcp
    type: tcp
    host: db
    port: 3306
  - name: api-live
    type: http
    url: http://backend:8000/live
  - name: api-ready
    type: http
    url: http://backend:8000/ready
    timeout: 4
  - name: proxy-ready
    type: http
    url: http://proxy/ready
    timeout: 4
